  <title>교실 속 사물 캐릭터 메이커</title>
  <!-- QR코드 생성을 위한 라이브러리 (QRious) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    :root { --primary: #4A90E2; --secondary: #FF9F43; --success: #10B981; --bg: #F0F4F8; --card: #FFFFFF; --text: #2C3E50; }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    .container { max-width: 1150px; margin: 0 auto; background: var(--card); border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #eef2f5; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; color: var(--primary); }
    
    /* 상단 게시판 링크 및 QR 설정 박스 */
    .board-config-box { background: #eef5ff; border: 2px solid #bcd6f7; border-radius: 16px; padding: 15px 20px; margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
    .board-config-box input { flex: 1; min-width: 250px; padding: 10px 14px; border: 1px solid #93c5fd; border-radius: 10px; font-size: 14px; user-select: text; -webkit-user-select: text; }
    .qr-popup-area { display: flex; align-items: center; gap: 15px; background: white; padding: 8px 15px; border-radius: 12px; border: 1px solid #cbd5e1; }

    /* 단계 탭 */
    .steps { display: flex; gap: 10px; margin-bottom: 25px; }
    .step-btn { flex: 1; padding: 14px; border: none; background: #e2e8f0; color: #64748b; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .step-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3); }
    .step-section { display: none; }
    .step-section.active { display: block; }

    /* 1단계 레이아웃 */
    .step1-grid { display: grid; grid-template-columns: 220px 1fr 280px; gap: 20px; align-items: start; }
    .panel { background: #f8fafc; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; }
    .panel h3 { margin-top: 0; font-size: 16px; margin-bottom: 12px; color: #334155; }
    .template-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .tpl-btn { padding: 10px 5px; border: 2px solid #cbd5e1; border-radius: 10px; background: white; cursor: pointer; font-weight: bold; font-size: 13px; }
    .tpl-btn.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    .canvas-area { display: flex; flex-direction: column; align-items: center; }
