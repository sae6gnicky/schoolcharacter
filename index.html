<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>교실 속 사물 캐릭터 메이커</title>
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #FF9F43;
      --success: #10B981;
      --bg: #F0F4F8;
      --card: #FFFFFF;
      --text: #2C3E50;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 1150px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 24px; color: var(--primary); }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      background: #fee2e2;
      color: #dc2626;
    }
    .status-badge.connected {
      background: #d1fae5;
      color: #059669;
    }
    .room-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #eef5ff;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
    }
    .room-box input {
      border: 1px solid #bcd6f7;
      border-radius: 8px;
      padding: 5px 8px;
      width: 100px;
      font-weight: bold;
      user-select: text;
      -webkit-user-select: text;
    }

    /* 선생님용 Firebase 자동 세팅 모달 (첫 화면 안내) */
    .setup-banner {
      background: #fffbeb;
      border: 2px solid #f59e0b;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      display: none;
    }
    .setup-banner.show { display: block; }
    .setup-banner h2 { margin-top: 0; color: #b45309; font-size: 20px; }
    .setup-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 850px) {
      .setup-grid { grid-template-columns: 1fr; }
    }
    .setup-steps {
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid #fde68a;
      font-size: 14px;
      line-height: 1.7;
    }
    .setup-steps ol { margin: 0; padding-left: 18px; }
    .setup-steps strong { color: #d97706; }
    .paste-box textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      border: 2px dashed #f59e0b;
      border-radius: 12px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
      user-select: text;
      -webkit-user-select: text;
    }

    /* 단계 탭 */
    .steps {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .step-btn {
      flex: 1;
      padding: 14px;
      border: none;
      background: #e2e8f0;
      color: #64748b;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .step-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
    }
    .step-section { display: none; }
    .step-section.active { display: block; }

    /* 1단계 레이아웃 */
    .step1-grid {
      display: grid;
      grid-template-columns: 220px 1fr 280px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 950px) {
      .step1-grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: #f8fafc;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #e2e8f0;
    }
    .panel h3 { margin-top: 0; font-size: 16px; margin-bottom: 12px; color: #334155; }
    
    .template-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .tpl-btn {
      padding: 10px 5px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .tpl-btn.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

    /* 캔버스 영역 */
    .canvas-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #canvas-wrapper {
      position: relative;
      width: 440px;
      height: 440px;
      background: #ffffff;
      border: 3px solid var(--primary);
      border-radius: 16px;
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
      justify-content: center;
      align-items: center;
      background: #f8fafc;
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #ccc;
      cursor: pointer;
    }
    .color-dot.active { transform: scale(1.2); box-shadow: 0 0 0 2px #000; }

    /* 24가지 표정 그리드 */
    .ref-preview {
      height: 110px;
      background: white;
      border: 2px dashed var(--secondary);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .ref-preview .emoji { font-size: 52px; line-height: 1; }
    .ref-preview .label { font-size: 14px; font-weight: bold; margin-top: 6px; color: #555; }
    .expr-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 290px;
      overflow-y: auto;
    }
    .expr-btn {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 20px;
      transition: 0.15s;
    }
    .expr-btn span { font-size: 11px; color: #475569; margin-top: 3px; font-weight: bold; }
    .expr-btn:hover, .expr-btn.active { background: #fffbeb; border-color: var(--secondary); }

    /* 공통 버튼 */
    .btn {
      padding: 11px 20px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--secondary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }
    .next-bar {
      margin-top: 25px;
      text-align: center;
      padding-top: 15px;
      border-top: 1px solid #eef2f5;
    }

    /* 2단계 레이아웃 */
